name: CI
on:
  push:
    branches: [main, master, develop]
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-password
          MYSQL_DATABASE: taskpilot_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      CI_DATABASE: ${{ matrix.database }}
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: ${{ matrix.database == 'mysql' && 'taskpilot_ci' || ':memory:' }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ci-password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, bcmath, pdo_sqlite, pdo_mysql
          tools: composer:v2
          coverage: pcov
      - name: Validate committed dependency contract
        run: |
          composer validate --no-check-publish
          php scripts/ci/check-runtime.php
      - run: cp .env.example .env
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: PHP syntax
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php artisan key:generate
      - name: Configure isolated test database
        run: php scripts/ci/configure-phpunit.php
      - run: vendor/bin/phpunit -c phpunit.ci.xml --log-junit test-results/phpunit.xml --coverage-clover test-results/coverage.xml --coverage-text
      - name: MySQL migration round trip
        if: matrix.database == 'mysql'
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --force
          php artisan migrate --force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: php-test-results-${{ matrix.database }}
          path: test-results/
          retention-days: 14
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Legacy Mix pulls node-sass 4; Vite uses optional native packages instead.
      - run: npm ci --ignore-scripts
      - run: npm run vite:build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build/
          if-no-files-found: error
          retention-days: 7
  ai:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: AI/requirements-ci.txt
      - run: python -m pip install -r AI/requirements-ci.txt
      - run: python -m pip check
      - run: python -m pip install coverage==7.10.6 ruff==0.12.12
      - run: ruff check AI --select E9,F63,F7,F82
      - run: python -m compileall -q AI
      - run: python -m coverage run --source=AI -m unittest discover -s AI -p 'test_*.py' -v
      - name: AI coverage
        if: always()
        run: python -m coverage xml -o test-results/ai-coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-test-results
          path: test-results/
          retention-days: 14
  security:
    uses: ./.github/workflows/security.yml
  production-smoke:
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /tmp/taskpilot-smoke.sqlite
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, bcmath, pdo_sqlite, pdo_mysql
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader --no-scripts
      - run: rm -rf public/build
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: public/build
      - run: bash scripts/ci/package-release.sh "$RUNNER_TEMP/release.tar.gz"
      - name: Boot extracted production artifact
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          tar -xzf "$RUNNER_TEMP/release.tar.gz" -C "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          mkdir -p storage/framework/{cache/data,sessions,views} storage/logs storage/app/public bootstrap/cache
          touch "$DB_DATABASE"
          php artisan package:discover
          php artisan config:cache
          php artisan view:cache
          php artisan migrate --force
          php artisan storage:link
          php artisan serve --host=127.0.0.1 --port=8000 > "$RUNNER_TEMP/smoke-server.log" 2>&1 &
      - name: Install browser test tooling
        run: |
          npm ci --prefix tests/browser --ignore-scripts
          tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser smoke tests
        run: tests/browser/node_modules/.bin/playwright test --config tests/browser/playwright.config.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-smoke-results
          path: |
            tests/browser/test-results/
            tests/browser/playwright-report/
            ${{ runner.temp }}/smoke-server.log
            ${{ runner.temp }}/smoke/storage/logs/
          retention-days: 14
  deployment-scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflows and shell scripts
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck="" -pyflakes=""
          bash -n scripts/deploy/activate.sh scripts/ci/test-deploy.sh scripts/ci/package-release.sh
      - run: bash scripts/ci/test-deploy.sh
  checks:
    name: CI required
    if: always()
    needs: [backend, frontend, ai, deployment-scripts, security, production-smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
